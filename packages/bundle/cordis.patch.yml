# Generic DSH Companion provider infrastructure. Provider bundles remain optional.
- id: agent-presets
  inject: [companionPresetRoot]
  config:
    default: dsh-companion
    roots:
      - path: !!js ctx.companionPresetRoot.path
        trust: system
    fallbacks:
      standard: dsh-companion
    includeShippedRoot: false
    includeUserRoot: false

- id: llm-deepseek
  config:
    enabled: false

- insert:
    - id: dsh-companion-preset-root
      name: '@dsh-companion/bundle'

    - id: dsh-companion-provider-catalog
      name: '@dsh-companion/provider-catalog'

    - id: dsh-companion-provider-account
      name: '@dsh-companion/provider-account'

    - id: dsh-companion-model-policy
      name: '@dsh-companion/model-policy'
      config: {}

    - id: dsh-companion-provider-client
      name: '@dsh-companion/provider-client'

    - id: dsh-companion-ui-provider-settings
      name: '@dsh-companion/ui-provider-settings'
